<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Polyxd · C · How it works</title>
    <!--
      Film C, "How it works" (apps/film/SCRIPT-OPTIONS.md). A screen; the same screen as a plain list
      of its parts; an AI writing that list from a question; the app drawing it in its own design.

      MUSIC (scripts/music-hf.ts, "Yearning" 70 bpm): lift 21.3 s (the AI writes the list),
      full 29.2 s (the app draws it), ring 43.8 s (the end card), end 48.0 s.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/polyxd/polyxd-web.css" />
    <link rel="stylesheet" href="assets/shared/kit.css" />
    <style>
      @font-face {
        font-family: "Young Serif";
        src: url("assets/fonts/YoungSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("assets/fonts/HankenGrotesk-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "DM Mono";
        src: url("assets/fonts/DMMono-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      /* A fallback the renderer's stylesheet names for code; declared so it resolves to the system face. */
      @font-face {
        font-family: "SFMono-Regular";
        src: local("SFMono-Regular"), local("SF Mono");
      }
    </style>
    <script src="assets/polyxd/polyxd-web.js"></script>
    <script src="assets/shared/mark.js"></script>
    <script src="assets/shared/kit.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="film-c" data-start="0" data-width="1920" data-height="1080" data-duration="48">
      <div id="c-sting" data-composition-id="sting" data-composition-src="assets/shared/sting.html" data-start="0" data-duration="2.8" data-track-index="1"></div>

      <div id="c-g" class="group">
        <div class="phone"><div class="phone-glass"><div class="phone-screen" id="c-screen"></div></div></div>
        <div class="seat" id="c-seat"></div>
      </div>

      <div id="c-cap1" class="caption"><p>This is a screen.</p></div>
      <div id="c-cap2" class="caption"><p>Polyxd describes it as a list of parts.</p></div>
      <div id="c-cap3" class="caption"><p>So an AI can write one.</p></div>
      <div id="c-cap4" class="caption"><p>Your app draws it in its own design.</p></div>
      <div id="c-cap5" class="caption"><p>And checks it works for everyone.</p></div>

      <div id="c-end" data-composition-id="end-card" data-composition-src="assets/shared/end-card.html" data-start="43.8" data-duration="4.2" data-track-index="1" data-variable-values='{"url":"polyxd.com · open source"}'></div>

      <audio id="c-music" src="assets/music.wav" data-start="0" data-track-index="10" data-volume="1"></audio>
      <audio id="c-tick" src="assets/sfx/tick.wav" data-start="38.25" data-track-index="13" data-volume="2"></audio>
      <audio id="c-blink-end" src="assets/sfx/blink.wav" data-start="45.3" data-track-index="14" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        const F = window.Film;
        const M = window.PolyxdMark;
        const D = 48;
        const ASK = "Send Priya £40 for dinner";
        /** The send screen as a person would describe it: what each part is, and what it says. */
        const PARTS = [
          ["Title", "Send money"],
          ["Choose a person", "Priya Raman"],
          ["Amount", "£40.00"],
          ["Reference", "Dinner"],
          ["Button", "Send £40.00"],
        ];

        // ——— Timings, in seconds. One thing moves at a time. ———
        const T = {
          gIn: 2.8, look1: 3.55, cap1In: 3.9, cap1Out: 7.9,
          toList: 8.7, read: 9.55, cap2In: 9.9, cap2Out: 15.2,
          clear: 16.0, askIn: 16.6, type: 17.2, think: 18.9, look2: 20.85, write: 21.3, cap3In: 23.8, cap3Out: 27.9,
          draw: 28.6, parts: 29.2, cap4In: 31.8, shop: 34.4, cap4Out: 37.3,
          checked: 38.0, cap5In: 38.8, cap5Out: 42.4, gOut: 43.1,
        };

        // ——— Build ———
        const screen = document.getElementById("c-screen");
        const layer = (el) => {
          const d = document.createElement("div");
          d.className = "layer";
          d.appendChild(el);
          screen.appendChild(d);
          return d;
        };
        // The bank's screen, drawn by the real renderer (no conversation: the app's own screen).
        const s1 = F.appScreen({ app: F.APPS.halden, where: "", doc: F.SEND, data: F.SEND_DATA, crossfades: true });
        const L1 = layer(s1.el);
        L1.style.opacity = "1";

        // The same screen as a list of its parts.
        const list = document.createElement("div");
        list.className = "parts";
        list.innerHTML =
          `<div class="ask"><div class="input"><span class="typed"></span><span class="caret"></span></div></div>` +
          PARTS.map(([k, v]) => `<div class="part"><div class="kind">${F.esc(k)}</div><div class="val">${F.esc(v)}</div></div>`).join("");
        list.querySelectorAll("*").forEach((n) => n.setAttribute("data-layout-allow-overlap", ""));
        const LL = layer(list);
        const rows = Array.from(list.querySelectorAll(".part"));
        const ask = list.querySelector(".ask");
        const typedEl = list.querySelector(".typed");
        const caretEl = list.querySelector(".caret");

        // And in a shop's design.
        const s3 = F.appScreen({ app: F.APPS.fernly, where: "", doc: F.SEND, data: F.SEND_DATA, crossfades: true });
        const L3 = layer(s3.el);

        document.getElementById("c-seat").innerHTML = M.svg("c-mark", 132);
        const mark = M.driver(document.getElementById("c-mark"), [
          { t: T.look1, state: "looking" },
          { t: T.read, state: "reading" },
          { t: T.think, state: "thinking", turns: 1 },
          { t: T.look2, state: "looking" },
          { t: T.checked, state: "checked" },
        ]);

        // ——— Timeline ———
        const tl = gsap.timeline({ paused: true });
        const $ = (id) => document.getElementById(id);

        // This is a screen.
        F.inn(tl, $("c-g"), T.gIn, 0.6, 0);
        F.inn(tl, $("c-cap1"), T.cap1In);
        F.out(tl, $("c-cap1"), T.cap1Out);

        // A list of parts.
        F.inn(tl, LL, T.toList, 0.8, 0);
        tl.set(L1, { opacity: 0 }, T.toList + 0.85);
        F.inn(tl, $("c-cap2"), T.cap2In);
        F.out(tl, $("c-cap2"), T.cap2Out);

        // The list clears; a question is typed; the list writes itself.
        tl.fromTo(rows, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: F.ease, immediateRender: false }, T.clear);
        F.inn(tl, ask, T.askIn, 0.35, 6);
        rows.forEach((r, i) => F.inn(tl, r, T.write + i * 0.45, 0.4, 8));
        F.inn(tl, $("c-cap3"), T.cap3In);
        F.out(tl, $("c-cap3"), T.cap3Out);

        // The list turns back into the screen, in the bank's design; then in a shop's.
        tl.set(s1.parts.flat(), { opacity: 0 }, T.draw - 0.1);
        tl.set(L1, { opacity: 1 }, T.draw - 0.1);
        F.out(tl, LL, T.draw, 0.5);
        F.assemble(tl, s1.parts, T.parts, 0.45, 0.45);
        F.inn(tl, $("c-cap4"), T.cap4In);
        F.inn(tl, L3, T.shop, 0.8, 0);
        tl.set(L1, { opacity: 0 }, T.shop + 0.85);
        F.out(tl, $("c-cap4"), T.cap4Out);

        // Checked.
        F.inn(tl, $("c-cap5"), T.cap5In);
        F.out(tl, $("c-cap5"), T.cap5Out);
        F.out(tl, $("c-g"), T.gOut, 0.6);

        const render = (t) => {
          typedEl.textContent = t >= T.type ? F.typed(t, T.type, ASK) : "";
          caretEl.style.display = t >= T.askIn && t < T.think ? "inline-block" : "none";
          mark(t);
        };
        const clock = { t: 0 };
        tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
        render(0);

        window.__timelines["film-c"] = tl;
      })();
    </script>
  </body>
</html>
