<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Film D2's intro sting: an ASCII glyph field that converges on the Polyxd lockup, blinks, and
         dissolves back into the dot grid. Needs shared/mark.js and shared/ascii-field.js on the host page. -->
  </head>
  <body>
    <template id="sting-ascii-template">
      <style>
        #sting-ascii-root {
          position: absolute;
          inset: 0;
          background: #0b0b0a;
        }
        #sting-ascii-canvas {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
      </style>
      <div id="sting-ascii-root" data-composition-id="sting-ascii" data-width="1920" data-height="1080" data-duration="5.4">
        <canvas id="sting-ascii-canvas" width="1920" height="1080"></canvas>
      </div>
      <script>
        (function () {
          // 0–0.5 the field fades up and flows; on the first accent (0.62) the glyphs converge on the
          // mark, then the wordmark (1.9); the pupil looks, then blinks (3.1); the field settles; from
          // 4.3 every glyph thins to a dot and fades into the ground the film continues on.
          const D = 5.4;
          const M = window.PolyxdMark;
          const seg = (t, a, d) => Math.max(0, Math.min(1, (t - a) / d));
          const EV = [
            { t: 2.5, state: "looking" },
            { t: 2.9, state: "idle" },
            { t: 3.25, state: "blink" },
          ];
          const build = () => {
            const field = window.AsciiField.create(document.getElementById("sting-ascii-canvas"), { y: 520 });
            const render = (t) =>
              field.draw(t, {
                bg: 1,
                field: seg(t, 0, 0.5),
                mark: seg(t, 0.57, 1.3),
                word: seg(t, 1.9, 1.1),
                quiet: seg(t, 1.6, 1.4),
                dissolve: M.ease(seg(t, 4.3, 0.9)),
                pupil: M.geometryAt(EV, t),
              });
            const tl = gsap.timeline({ paused: true });
            const clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
            render(0);
            window.__timelines["sting-ascii"] = tl;
            if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          };
          Promise.all(["18px 'DM Mono'", "160px 'Young Serif'"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(build);
        })();
      </script>
    </template>
  </body>
</html>
