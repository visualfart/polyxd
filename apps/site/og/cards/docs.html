<!doctype html>
<!-- Docs, one card per page: {{TITLE}}, {{SUB}}, {{URL}} and {{SIZE}} are filled per page. Designed on the Claude Design canvas (page "OG images"); rendered by scripts/og.ts. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}</style>
</head><body><div style="position: relative; width: 1200px; height: 630px; overflow: hidden; background: #F3F1EC; color: #141413;">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(20,20,19,.16) 1.6px, transparent 1.9px); background-size: 14px 14px; -webkit-mask-image: radial-gradient(ellipse 48% 70% at 80% 50%, #000 25%, transparent 78%); mask-image: radial-gradient(ellipse 48% 70% at 80% 50%, #000 25%, transparent 78%);"></div>
  <div style="position: absolute; left: 640px; top: 0; width: 560px; height: 630px;">
<div style="position: absolute; left: 20px; top: 70px; width: 540px; height: 490px; display: grid; grid-template-columns: 110px minmax(0, 1fr); overflow: hidden; border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #DAD5CA, 0 30px 50px -34px rgba(20,20,19,.5);">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 30px 20px; background: #F8F6F1; border-right: 1px solid #E4E0D6;"><i style="width: 70%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i><i style="width: 90%; height: 10px; border-radius: 5px; background: #141413;"></i><i style="width: 60%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i><i style="width: 80%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i><i style="width: 50%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i><i style="width: 75%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i><i style="width: 65%; height: 10px; border-radius: 5px; background: #DAD5CA;"></i></div>
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 30px 28px;">
    <span style="font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.05;">{{TITLE}}</span>
    <i style="width: 92%; height: 10px; border-radius: 5px; background: #E4E0D6;"></i><i style="width: 74%; height: 10px; border-radius: 5px; background: #E4E0D6;"></i>
    <div style="padding: 20px 22px; border-radius: 16px; background: #141413; color: #F3F1EC; font-family: 'DM Mono', monospace; font-size: 24px; line-height: 1.7;"><span style="color: #8A857B;">$</span> npm i @polyxd/react<br><span style="color: #8A857B;">$</span> npx polyxd check</div>
    <i style="width: 84%; height: 10px; border-radius: 5px; background: #E4E0D6;"></i>
  </div>
</div>
  </div>
  <div style="position: absolute; left: 64px; top: 56px; bottom: 52px; width: 560px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 10px;"><svg width="52" height="52" viewBox="0 0 32 32" style="display: block; flex-shrink: 0;" aria-hidden="true"><path d="M13 6H19C22.864 6 26 9.136 26 13V19C26 22.864 22.864 26 19 26H13C9.136 26 6 22.864 6 19V13C6 9.136 9.136 6 13 6Z" fill="#FF6E40"></path><path d="M8.5 14H8.5C9.88 14 11 15.12 11 16.5V25.5C11 26.88 9.88 28 8.5 28H8.5C7.12 28 6 26.88 6 25.5V16.5C6 15.12 7.12 14 8.5 14Z" fill="#FF6E40"></path><path d="M16 11.2H16C20.224 11.2 20.8 11.776 20.8 16V16C20.8 20.224 20.224 20.8 16 20.8H16C11.776 20.8 11.2 20.224 11.2 16V16C11.2 11.776 11.776 11.2 16 11.2Z" fill="#FFFFFF"></path><circle cx="17.2" cy="15.6" r="2.4" fill="#141413"></circle></svg><span style="font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 40px; letter-spacing: -.01em; line-height: 1;">polyxd</span></div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 12px; font-family: 'DM Mono', monospace; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; color: #5E5A52;"><span style="flex-shrink: 0; width: 12px; height: 12px; border-radius: 99px; background: #FF6E40;"></span>Docs</div>
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: {{SIZE}}px; line-height: 1.02; letter-spacing: -.015em;">{{TITLE}}</h1>
      <p style="margin: 0; max-width: 560px; font-size: 28px; line-height: 1.3; color: #5E5A52;">{{SUB}}</p>
    </div>
    <div style="margin-top: 26px; font-family: 'DM Mono', monospace; font-size: 24px; color: #5E5A52;">{{URL}}</div>
  </div>
</div>
</body></html>
