<script>
(() => {
  const root = document.documentElement;
  root.classList.add("js");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && matchMedia("(min-width: 900px) and (min-height: 600px)").matches) root.classList.add("motion");
})();
</script>
</head>
<body class="home page">

<p class="hero-lead"><!--LEAD--></p>

</div>
<div class="page-art" aria-hidden="true"><!--ART--></div>

</section>
