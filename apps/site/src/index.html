<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyxd: every ask gets a screen</title>
<meta name="description" content="Apps only have the screens someone built in advance. Polyxd draws the rest on demand, in your own design system, and checks each one before anyone sees it.">
<!--HEAD-->
<script>
// Scroll scenes are opt-in: without this class every scene shows its still frame.
(() => {
  const root = document.documentElement;
  root.classList.add("js");
  const wide = () => matchMedia("(min-width: 900px) and (min-height: 600px)").matches;
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && wide()) root.classList.add("motion");
})();
</script>
</head>
<body class="home">
<a class="skip" href="#main">Skip to content</a>
<!--HEADER-->
<main id="main">

<!-- 01–04 · The ask. A field of ink dots that gathers into a screen when someone asks for one. -->
<section class="hero" data-scene="hero" data-kind="hero" aria-labelledby="hero-title">
<canvas class="field" data-field data-quiet=".site-header .brand, .site-header .site-nav a, [data-quiet] .hero-eyebrow, [data-quiet] .hero-title, [data-quiet] .hero-lead" data-solid="[data-quiet] .ask, [data-quiet] .chip, [data-quiet] .cta-row .btn, [data-quiet] .hero-ctas a, .stage-status, .answer figcaption, .ask-reset:not([hidden]), .scroll-cue" aria-hidden="true"></canvas>
<div class="hero-wash" aria-hidden="true"></div>
<div class="wrap hero-grid">
<div class="hero-copy" data-quiet>
<p class="eyebrow hero-eyebrow"><span class="dot" aria-hidden="true"></span>Open source · free to start</p>
<h1 class="display hero-title" id="hero-title">Every ask gets a screen.</h1>
<p class="hero-lead">Drawn on demand in your own design system. Checked before anyone sees it.</p>
<form class="ask" data-ask-form aria-label="Ask one of four real products">
<!--MARK:idle:36:ask-mark-->
<p class="ask-line"><span class="ask-text" data-ask-text>Send £40 to Priya for dinner</span><i class="ask-caret" aria-hidden="true"></i></p>
<button class="btn btn-signal" type="submit">Show me</button>
</form>
<div class="chips" role="group" aria-label="Pick an ask"><!--HERO_CHIPS--></div>
<p class="hero-ctas"><a class="btn btn-line" href="/docs/quickstart/">Get started</a><a class="hero-link" href="https://studio.polyxd.com">Try Studio</a></p>
</div>
<div class="hero-stage" data-stage>
<div class="hero-mark" data-hero-mark><!--MARK:idle:320:big-mark--></div>
<p class="stage-status" data-status role="status" aria-live="polite"></p>
<div class="answers" data-answers><!--HERO_ANSWERS--></div>
<button type="button" class="link-btn ask-reset" data-ask-reset hidden>Ask something else</button>
</div>
</div>
<p class="scroll-cue" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 4v12M5 11l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Scroll</p>
</section>

<!--SCENE:gap-->

<!--SCENE:turn-->

<!--SCENE:wipe-->

<!--SCENE:check-->

<!--SCENE:gone-->

<!--SCENE:platform-->

<!--SCENE:roles-->

<!--SCENE:demos-->

<!--SCENE:cta-->

<!--TRAVELLER-->
</main>
<!--FOOTER-->
<script src="/assets/site.js" defer></script>
<script src="/assets/home.js" defer></script>
</body>
</html>
