# Every push and pull request: the tests, the licence audit, and the release check — so the
# packages can't quietly become unpublishable between one release and the next.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scripts run TypeScript directly, which needs a Node that strips types by default.
      # 26 is what this repository is developed and tested on.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Spec first, in its own run: on a clean checkout, one tsc -b (TypeScript 7) resolves
      # @polyxd/spec before spec has emitted and keeps that failure for the rest of the build.
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run check:licences
      - run: npm run release:check
