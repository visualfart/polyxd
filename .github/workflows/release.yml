# Publishes to npm when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every package already on npm at its current version is skipped, so a release publishes only
# what changed. On a tag, the generation server's Docker image then goes to GitHub Container
# Registry (the `image` job below), the VS Code extension to its two registries (`vscode`), and
# the MCP server's entry to the MCP Registry (`registry`).
#
# No npm token: this uses npm trusted publishing. Each package on npmjs.com names this repository
# and this workflow file (release.yml) as its trusted publisher, and npm accepts the job's GitHub
# OIDC identity in place of a token. Provenance, linking each version to the commit and workflow
# that built it, comes with that automatically. A package has to exist on npm before it can name a
# trusted publisher, so a new package's first version is published by hand, with 2FA:
#
#   npm login && npm run release:publish
#   npx npm@12 trust github <name> --repo visualfart/polyxd --file release.yml --allow-publish --yes
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

# One release at a time for a tag: a second run for the same tag waits, then finds everything
# already published and skips it, instead of racing the first to npm.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Spec first, in its own run: on a clean checkout, one tsc -b (TypeScript 7) resolves
      # @polyxd/spec before spec has emitted and keeps that failure for the rest of the build.
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run check:licences
      # The tag has to match the version being published, or the release is ambiguous.
      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./packages/spec/package.json').version")"
          test "$want" = "$have" || { echo "tag v$want but packages are at $have"; exit 1; }
      - run: npm run release:publish

  # The editor extension (apps/vscode), on version tags only and only after the npm publish passed:
  # to the Visual Studio Marketplace with the VSCE_PAT secret and to Open VSX (Cursor, VSCodium,
  # Windsurf) with OVSX_PAT. A registry whose secret isn't set, or that already has this version,
  # is skipped with a notice, so the job is green until the accounts exist and on re-runs.
  # apps/vscode/PUBLISHING.md says how to get both tokens. The tokens reach vsce and ovsx as
  # environment variables, never on a command line.
  # The Marketplace is published with Microsoft Entra ID (a managed identity trusted by this job
  # through GitHub's OIDC token, so no Marketplace token is stored) when the AZURE_* repository
  # variables are set, and with the VSCE_PAT secret otherwise. Global PATs stop working on
  # 1 December 2026, so Entra ID is the lasting route. apps/vscode/PUBLISHING.md has both.
  vscode:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Which registries still need this version
        id: need
        run: node apps/vscode/scripts/published.ts
      # README images and links are rewritten against this tag (scripts/package.ts).
      - name: Package
        if: steps.need.outputs.any == 'true'
        run: |
          npm run build -w @polyxd/core
          npm run build:preview -w @polyxd/react
          npm run package -w polyxd-vscode
      - name: Sign in to Azure with the publishing identity
        if: steps.need.outputs.marketplace == 'true' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to the Visual Studio Marketplace (Entra ID)
        if: steps.need.outputs.marketplace == 'true' && vars.AZURE_CLIENT_ID != ''
        working-directory: apps/vscode
        run: npx vsce publish --azure-credential --packagePath "${{ steps.need.outputs.vsix }}"
      - name: Publish to the Visual Studio Marketplace (token)
        if: steps.need.outputs.marketplace == 'true' && vars.AZURE_CLIENT_ID == ''
        working-directory: apps/vscode
        run: npx vsce publish --packagePath "${{ steps.need.outputs.vsix }}"
      - name: Publish to Open VSX
        if: steps.need.outputs.openvsx == 'true'
        working-directory: apps/vscode
        run: npx --yes ovsx@1.2.0 publish --skip-duplicate "${{ steps.need.outputs.vsix }}"

  # The MCP Registry entry, com.polyxd/mcp, on version tags once npm has the version it points at.
  # Signing in proves control of polyxd.com: the MCP_REGISTRY_KEY secret is the Ed25519 private key
  # (hex) whose public half polyxd.com serves at /.well-known/mcp-registry-auth. Skipped, with a
  # notice, when the secret is missing or the registry already has this version.
  registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Does the registry need this version?
        id: need
        env:
          HAS_KEY: ${{ secrets.MCP_REGISTRY_KEY != '' }}
        run: |
          version=$(jq -r .version packages/mcp/server.json)
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice title=MCP Registry::skipped, MCP_REGISTRY_KEY is not set (packages/mcp/README.md)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/com.polyxd%2Fmcp/versions/$version"; then
            echo "::notice title=MCP Registry::com.polyxd/mcp $version is already published"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # A pinned release, checked against the checksum its release lists, since it runs with the key.
      - name: Install mcp-publisher 1.8.1
        if: steps.need.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.1 --repo modelcontextprotocol/registry --pattern mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        if: steps.need.outputs.go == 'true'
        working-directory: packages/mcp
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          ../../mcp-publisher login http --domain polyxd.com --private-key "$MCP_REGISTRY_KEY"
          # The registry checks that npm has the version, and npm can take a few minutes to serve
          # one it has just accepted.
          for i in $(seq 1 20); do
            ../../mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

  # The generation server's image, on version tags only and only after everything above passed and
  # published. It goes to GitHub Container Registry with the workflow's own token: no secret to
  # set. The first push creates the package as private; make it public in the package's settings.
  image:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/polyxd-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
