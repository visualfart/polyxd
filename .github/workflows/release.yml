# Publishes to npm when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every package already on npm at its current version is skipped, so a release publishes only
# what changed. Provenance links each published package to the commit and workflow that built it.
#
# Needs one repository secret, NPM_TOKEN: an npm automation token from an account that owns the
# @polyxd scope and the unscoped `polyxd` package.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - run: npm run test:all
      - run: npm run check:licences
      # The tag has to match the version being published, or the release is ambiguous.
      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./packages/spec/package.json').version")"
          test "$want" = "$have" || { echo "tag v$want but packages are at $have"; exit 1; }
      - run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
